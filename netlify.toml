# Deploys and per-pull-request previews through Netlify's Git integration.
# Hosting is still open in the spec (§18): if Vercel is chosen, just delete this file.
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
