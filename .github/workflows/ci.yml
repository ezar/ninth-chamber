name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Browser smoke test: every level loads, plays and visits each room without console errors.
      - run: npx playwright install --with-deps chromium
      - run: pnpm smoke
      # The medium tier draws fire and sun shadow maps that the mobile tier does not.
      - run: pnpm smoke --tier medium
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
