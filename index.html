<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!-- Text placeholders are filled from i18n/en.json, and the public URL, at build time (scripts/vite-site.ts). -->
    <title>%t:title%</title>
    <meta name="description" content="%t:meta.description%" />
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./icons/seal.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%t:meta.shortName%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%t:title%" />
    <meta property="og:title" content="%t:title%" />
    <meta property="og:description" content="%t:meta.description%" />
    <meta property="og:url" content="%site%" />
    <meta property="og:image" content="%site%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%t:meta.imageAlt%" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%t:title%" />
    <meta name="twitter:description" content="%t:meta.description%" />
    <meta name="twitter:image" content="%site%og-image.jpg" />
    <meta name="twitter:image:alt" content="%t:meta.imageAlt%" />

    <script>
      // Before any bundle arrives: the language for the loading screen's fallback text
      // (the stored choice, else the first of the browser's languages we have).
      (function () {
        var lang = 'en';
        try {
          var saved = JSON.parse(localStorage.getItem('nc.settings') || '{}').language;
          var prefs = navigator.languages || [navigator.language || 'en'];
          if (saved === 'en' || saved === 'es') lang = saved;
          else
            for (var i = 0; i < prefs.length; i++) {
              var l = String(prefs[i]).toLowerCase().split('-')[0];
              if (l === 'en' || l === 'es') {
                lang = l;
                break;
              }
            }
        } catch (e) {
          /* storage blocked: English */
        }
        document.documentElement.lang = lang;
      })();
    </script>
    <link rel="preload" as="image" href="/loading/reel-1.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (the fallbacks are close enough). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body class="loading" data-phase="title">
    <canvas id="game" tabindex="0"></canvas>

    <div id="hud">
      <div id="hud-health" role="meter" data-i18n-label="hud.health"><div id="hud-health-fill"></div></div>
      <div id="hud-stats"></div>
      <div id="hud-title"></div>
      <div id="hud-notice" role="status"></div>
      <div id="hud-hint" role="status"></div>
      <div id="hud-prompt"></div>
    </div>

    <button id="pause-button" type="button" data-i18n-label="pause.button">
      <span aria-hidden="true"></span>
    </button>

    <div id="fade" aria-hidden="true"></div>

    <div id="intro" hidden>
      <div class="letterbox top"></div>
      <div class="letterbox bottom"></div>
      <p id="intro-card" aria-live="polite"></p>
      <p id="intro-skip"></p>
    </div>

    <div id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="reader-title">
      <div class="reader-stage">
        <article id="reader-sheet" class="sheet">
          <figure id="reader-rubbing" class="rubbing" hidden>
            <div id="reader-glyphs"></div>
            <figcaption data-i18n="reader.rubbing"></figcaption>
          </figure>
          <p id="reader-meta" class="sheet-meta"></p>
          <h2 id="reader-title" class="sheet-title"></h2>
          <div id="reader-body" class="sheet-body"></div>
        </article>
        <footer class="reader-foot">
          <span id="reader-counter"></span>
          <button id="reader-close" type="button">
            <kbd id="reader-key">E</kbd><span data-i18n="reader.close"></span>
          </button>
        </footer>
      </div>
    </div>

    <div id="end" hidden role="dialog" aria-modal="true" aria-labelledby="end-title">
      <div class="end-grid">
        <section class="end-relic">
          <p id="end-kicker" class="end-kicker"></p>
          <h1 id="end-title"></h1>
          <div id="end-figure" class="starmap"></div>
          <p class="relic-line"></p>
          <p class="relic-line"></p>
          <p class="relic-line"></p>
        </section>
        <section class="end-record">
          <div class="end-rank">
            <div id="end-seal"></div>
            <div>
              <p class="label" data-i18n="end.seal"></p>
              <p id="end-rank-name"></p>
              <p id="end-score"></p>
            </div>
          </div>
          <dl id="end-stats"></dl>
          <p id="end-best"></p>
          <div class="end-teaser">
            <p id="end-next-label" class="label"></p>
            <p id="end-next-name" class="teaser-name"></p>
            <p id="end-next-line" class="teaser-line"></p>
            <p id="end-next-soon" class="teaser-soon" data-i18n="end.soon"></p>
          </div>
          <div id="end-actions" class="end-actions">
            <button id="end-restart" type="button" data-nav data-i18n="end.restart"></button>
            <button id="end-menu" type="button" data-nav data-i18n="end.menu"></button>
          </div>
        </section>
      </div>
    </div>

    <!--
      The start screen renders its loading state from the first paint, before
      any script: the button is disabled and busy, the line shimmers, the seal
      breathes and a reel of in-game renders drifts behind the title. The
      bilingual fallbacks are replaced from i18n/*.json once the game loads.
    -->
    <div id="start">
      <div id="loading-reel" aria-hidden="true">
        <div class="reel reel-1"></div>
        <div class="reel reel-2"></div>
        <div class="reel reel-3"></div>
        <div class="reel reel-4"></div>
      </div>
      <div class="scrim" aria-hidden="true"></div>
      <main class="title-block">
        <div class="lockup">
          <div id="start-seal"></div>
          <h1 data-i18n="title" class="fallback">
            <span lang="en">The Ninth Chamber</span><span lang="es">La Novena Cámara</span>
          </h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
        <p class="kicker fallback" data-i18n="start.kicker">
          <span lang="en">Tomb of Qarrum · First chamber</span
          ><span lang="es">Tumba de Qarrum · Primera cámara</span>
        </p>
        <nav id="start-menu" class="title-menu">
          <button
            id="start-button"
            type="button"
            class="fallback"
            data-nav
            data-i18n="start.play"
            disabled
            aria-busy="true"
          >
            <span lang="en">Enter the tomb</span><span lang="es">Entrar en la tumba</span>
          </button>
          <button id="start-options" type="button" data-nav data-i18n="start.options"></button>
          <button id="credits-button" type="button" data-nav data-i18n="start.credits"></button>
        </nav>
        <div id="loading" role="status" aria-live="polite">
          <div class="load-seal" aria-hidden="true"></div>
          <div class="load-track"><div id="loading-fill"></div></div>
          <p id="loading-label" class="fallback">
            <span lang="en">Loading…</span><span lang="es">Cargando…</span>
          </p>
        </div>
        <p class="help" data-i18n="help"></p>
      </main>
      <footer class="legal">
        <span data-i18n="start.copyright"></span>
        <span id="version"></span>
      </footer>
    </div>

    <div id="credits" hidden role="dialog" aria-modal="true" aria-labelledby="credits-title">
      <div class="credits-panel">
        <h2 id="credits-title" data-i18n="credits.title"></h2>
        <dl id="credits-list"></dl>
        <p class="credits-foot">
          <a href="./credits.txt" target="_blank" rel="noopener" data-i18n="credits.full"></a>
          <button id="credits-back" type="button" data-i18n="credits.back"></button>
        </p>
      </div>
    </div>

    <!-- The cinematic cut into play: a short fade to black and back. -->
    <div id="curtain" aria-hidden="true"></div>

    <div id="menu" class="menu" role="dialog" aria-modal="true" hidden>
      <div class="menu-veil" aria-hidden="true"></div>
      <div class="menu-body">
        <section class="menu-panel" data-panel="pause">
          <p class="menu-kicker" data-i18n="level.antechamber"></p>
          <h2 class="menu-title" id="menu-pause-title" data-i18n="pause.title"></h2>
          <div class="menu-list">
            <button
              class="menu-item"
              type="button"
              data-nav
              data-action="resume"
              data-i18n="pause.resume"
            ></button>
            <button
              class="menu-item"
              type="button"
              data-nav
              data-action="restart"
              data-i18n="pause.restart"
            ></button>
            <button
              class="menu-item"
              type="button"
              data-nav
              data-action="options"
              data-i18n="pause.options"
            ></button>
            <button
              class="menu-item"
              type="button"
              data-nav
              data-action="quit"
              data-i18n="pause.quit"
            ></button>
          </div>
        </section>
        <section class="menu-panel menu-panel-wide" data-panel="options" hidden>
          <p class="menu-kicker" data-i18n="title"></p>
          <h2 class="menu-title" id="menu-options-title" data-i18n="options.title"></h2>
          <div class="options" id="options-list"></div>
          <div class="menu-list menu-list-foot">
            <button
              class="menu-item"
              type="button"
              data-nav
              data-action="back"
              data-i18n="options.back"
            ></button>
          </div>
        </section>
        <section class="menu-panel" data-panel="confirm" hidden>
          <p class="menu-kicker" data-i18n="pause.title"></p>
          <h2 class="menu-title menu-title-small" id="confirm-title"></h2>
          <p class="menu-text" id="confirm-body"></p>
          <div class="menu-list">
            <button class="menu-item" type="button" data-nav data-action="confirm" id="confirm-ok"></button>
            <button
              class="menu-item"
              type="button"
              data-nav
              data-action="cancel"
              data-i18n="confirm.cancel"
            ></button>
          </div>
        </section>
      </div>
      <footer class="menu-foot">
        <div class="menu-hints" id="menu-hints"></div>
        <div class="menu-version" id="menu-version"></div>
      </footer>
    </div>

    <div id="touch" aria-hidden="true">
      <div id="stick-ghost"><span data-i18n="touch.move"></span></div>
      <div id="stick"><div id="stick-knob"></div></div>
      <div id="look-ghost"><span data-i18n="touch.look"></span></div>
      <button data-button="jump" class="tbtn tbtn-jump">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6M6 19l6-6 6 6" /></svg>
        <span data-i18n="touch.jump"></span>
      </button>
      <button data-button="action" class="tbtn tbtn-action">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M8 13V6.5a1.5 1.5 0 013 0V12m0-6.5v-1a1.5 1.5 0 013 0V12m0-5a1.5 1.5 0 013 0v6.5a6 6 0 01-6 6h-.6a6 6 0 01-4.7-2.3L4.2 14a1.5 1.5 0 012.3-1.9L8 14"
          />
        </svg>
        <span data-i18n="touch.action"></span>
      </button>
      <button data-button="walk" data-toggle="true" class="tbtn tbtn-walk">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4.5a1.8 1.8 0 100 .01M8 8.5l-2 5 3 1.5 1 6M8 8.5l4 1.5 2 3.5M10 15l4 1 1 5" />
        </svg>
        <span data-i18n="touch.walk"></span>
      </button>
      <!-- Combat: hold to fire (locks onto the nearest jackal, draws the pistols if needed); draw or holster. -->
      <button data-button="fire" class="tbtn tbtn-slot-a">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="6" />
          <path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5" />
        </svg>
        <span data-i18n="touch.fire"></span>
      </button>
      <button data-button="weapons" class="tbtn tbtn-slot-b">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 7.5h16v3.5h-16zM6.5 11l-1.8 7h3.6l1.6-7M11 11v1.6a1.6 1.6 0 001.6 1.6H14V11" />
        </svg>
        <span data-i18n="touch.draw"></span>
      </button>
    </div>

    <div id="fatal" data-i18n="error.noWebGL" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
