<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0f0d0b" />
    <title>The Ninth Chamber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="grain" aria-hidden="true"></div>

    <div id="hud">
      <div id="hud-health" role="meter" aria-label="Health"><div id="hud-health-fill"></div></div>
      <div id="hud-stats"></div>
      <div id="hud-title"></div>
      <div id="hud-notice" role="status"></div>
      <div id="hud-hint" role="status"></div>
      <div id="hud-prompt"></div>
    </div>

    <div id="fade" aria-hidden="true"></div>

    <div id="end" hidden>
      <div class="panel">
        <div class="seal" aria-hidden="true"></div>
        <h1 id="end-title"></h1>
        <div id="end-stats"></div>
        <button id="end-restart"></button>
      </div>
    </div>

    <div id="start">
      <div class="panel">
        <p class="kicker" data-i18n="start.kicker"></p>
        <h1 data-i18n="title"></h1>
        <p class="sub" data-i18n="level.antechamber"></p>
        <button id="start-button" data-i18n="start.play"></button>
        <p class="help" data-i18n="help"></p>
      </div>
    </div>

    <div id="touch" aria-hidden="true">
      <div id="stick-ghost"><span data-i18n="touch.move"></span></div>
      <div id="stick"><div id="stick-knob"></div></div>
      <div id="look-ghost"><span data-i18n="touch.look"></span></div>
      <button data-button="jump" class="tbtn tbtn-jump">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6M6 19l6-6 6 6" /></svg>
        <span data-i18n="touch.jump"></span>
      </button>
      <button data-button="action" class="tbtn tbtn-action">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M8 13V6.5a1.5 1.5 0 013 0V12m0-6.5v-1a1.5 1.5 0 013 0V12m0-5a1.5 1.5 0 013 0v6.5a6 6 0 01-6 6h-.6a6 6 0 01-4.7-2.3L4.2 14a1.5 1.5 0 012.3-1.9L8 14"
          />
        </svg>
        <span data-i18n="touch.action"></span>
      </button>
      <button data-button="walk" data-toggle="true" class="tbtn tbtn-walk">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4.5a1.8 1.8 0 100 .01M8 8.5l-2 5 3 1.5 1 6M8 8.5l4 1.5 2 3.5M10 15l4 1 1 5" />
        </svg>
        <span data-i18n="touch.walk"></span>
      </button>
    </div>

    <div id="fatal" data-i18n="error.noWebGL" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
