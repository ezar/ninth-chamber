<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1a130d" />
    <title>The Ninth Chamber</title>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>

    <div id="hud">
      <div id="hud-stats" data-i18n="loading"></div>
      <div id="hud-help" data-i18n="help"></div>
    </div>

    <div id="touch" aria-hidden="true">
      <div id="stick"><div id="stick-knob"></div></div>
      <button data-button="jump" class="tbtn tbtn-jump" data-i18n="touch.jump"></button>
      <button data-button="action" class="tbtn tbtn-action" data-i18n="touch.action"></button>
      <button data-button="walk" data-toggle="true" class="tbtn tbtn-walk" data-i18n="touch.walk"></button>
    </div>

    <div id="fatal" data-i18n="error.noWebGL" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
